# Local development stack.
#
#   docker compose up --build                  # app, worker, Postgres, Redis,
#                                              # Keycloak and Azurite
#   docker compose run --rm app python -m leyline.seed   # load the sample corpus
#   docker compose --profile infra up          # + Jaeger (not used yet)
#
# All credentials here are throwaway local-dev values and every published
# port is bound to loopback only. Sign in at http://localhost:8000/ with a
# demo user from deploy/keycloak/leyline-realm.json (password: Leyline-dev-1!).

name: leyline

services:
  app:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      azurite:
        condition: service_started
    environment:
      # The image defaults to production, which refuses to start without
      # model credentials. Locally the app starts and /readyz reports
      # not-ready until they are provided in .env.
      LEYLINE_ENV: local
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: &database_url postgresql+pg8000://leyline:leyline-dev-only@postgres:5432/leyline
      BLOB_CONNECTION_STRING: &blob_connection "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;" 
      # Server-to-server calls use the compose network name; the browser is
      # sent to Keycloak's public URL (see KC_HOSTNAME below).
      OIDC_METADATA_URL: http://keycloak:8080/realms/leyline/.well-known/openid-configuration
      OIDC_CLIENT_ID: leyline-web
      OIDC_CLIENT_SECRET: leyline-dev-secret-change-me
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama running on the host
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app-logs:/var/log/leyline
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # One-shot: bring the schema to the latest revision before anything starts.
  migrate:
    build: .
    command: ["python", "-m", "leyline.db", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LEYLINE_ENV: local
      DATABASE_URL: *database_url
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Indexes uploaded documents: parse, chunk, embed. Same image as the app.
  worker:
    build: .
    command: ["python", "-m", "leyline.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      azurite:
        condition: service_started
    environment:
      LEYLINE_ENV: local
      DATABASE_URL: *database_url
      BLOB_CONNECTION_STRING: *blob_connection
      WORKER_HEARTBEAT_PATH: /tmp/leyline-worker-heartbeat
    healthcheck:
      # The worker serves no HTTP; healthy means its loop ran recently.
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/leyline-worker-heartbeat') < 120 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    # Sessions and rate-limit counters only; losing them just signs people out.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
      # Issuer and browser-facing URLs use localhost:8080; back-channel calls
      # (token, JWKS) are answered on whatever host the caller used, so the
      # app container can reach http://keycloak:8080 without an issuer clash.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/keycloak/leyline-realm.json:/opt/keycloak/data/import/leyline-realm.json:ro
    healthcheck:
      # The image has no curl; probe the readiness endpoint over a raw socket.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: leyline
      POSTGRES_PASSWORD: leyline-dev-only
      POSTGRES_DB: leyline
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leyline -d leyline"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    # --location makes Azurite actually use the mounted volume; without it blobs
    # live in the container and vanish on recreate while Postgres still points
    # at them.
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite-data:/data

  jaeger:
    profiles: [infra]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"

volumes:
  app-logs:
  pg-data:
  azurite-data:
