# Local development stack.
#
#   docker compose up --build                  # app only
#   docker compose --profile infra up --build  # app + Postgres, Redis,
#                                              # Keycloak, Azurite, Jaeger
#
# The infra services are not used by the app yet; they arrive with
# Phases 1-3 of the plan. All credentials here are throwaway local-dev
# values and every port is bound to loopback only.

name: leyline

services:
  app:
    build: .
    environment:
      # The image defaults to production, which refuses to start without
      # model credentials. Locally the app starts and /readyz reports
      # not-ready until they are provided in .env.
      LEYLINE_ENV: local
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app-logs:/var/log/leyline
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  postgres:
    profiles: [infra]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: leyline
      POSTGRES_PASSWORD: leyline-dev-only
      POSTGRES_DB: leyline
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leyline -d leyline"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: [infra]
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    profiles: [infra]
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
    ports:
      - "127.0.0.1:8080:8080"

  azurite:
    profiles: [infra]
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite-data:/data

  jaeger:
    profiles: [infra]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"

volumes:
  app-logs:
  pg-data:
  azurite-data:
