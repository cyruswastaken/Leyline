# Extends gitleaks' default rules. The only exceptions are test files whose job
# is to contain fake credential-shaped strings (redaction and config tests), and the
# identifiers of two built-in Azure roles (below). Real secrets anywhere else,
# including these files' neighbours, still fail.
title = "Leyline gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Fake credentials used as test data"
paths = [
  '''tests/test_guardrails\.py''',
  '''tests/test_config\.py''',
  '''tests/test_redteam\.py''',
  '''tests/test_conversations\.py''',
]

# The ids of Azure's built-in "AcrPull" and "Key Vault Secrets User" roles are public
# constants (infra/modules/platform.bicep); gitleaks reads them as generic API keys.
# Only these two exact values are allowed, so any other secret-shaped GUID still fails.
regexes = [
  '''7f951dda-4ed3-4680-a7ca-43fe172d538d''',
  '''4633458b-17de-408a-b874-0445c86b69e6''',
]
