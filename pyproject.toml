[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leyline"
version = "0.1.0"
description = "Secure enterprise IT helpdesk chatbot with permission-aware RAG"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "openai>=2",
    "Authlib>=1.3,<2",
    # <2.1: 2.1 ships compiled-only Cython modules that locked-down machines can block
    "SQLAlchemy>=2.1.8,<2.2",
    "alembic>=1.13,<2",
    "azure-storage-blob>=12.19,<13",
    "defusedxml>=0.7",
    "pgvector>=0.3",
    # pure-Python driver: identical on locked-down laptops, CI and containers
    "pg8000>=1.31,<2",
    "pydantic-settings>=2.6,<3",
    "pypdf>=5,<7",
    "redis>=5,<9",
    "requests>=2.32,<3",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "gunicorn>=23; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.26",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leyline = ["templates/*.html", "db/migrations/*.ini", "db/migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["leyline"]
branch = true
# Alembic executes migration scripts itself, outside the normal import path.
omit = ["*/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E501"]
"tests/**" = ["S101", "S105", "S106", "S311", "S608", "E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["leyline"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["authlib.*", "fakeredis.*", "pgvector.*", "azure.*", "opentelemetry.exporter.*"]
ignore_missing_imports = true
