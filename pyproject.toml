[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leyline"
version = "0.1.0"
description = "Secure enterprise IT helpdesk chatbot with permission-aware RAG"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "openai>=2",
    "Authlib>=1.3,<2",
    "pydantic-settings>=2.6,<3",
    "redis>=5,<9",
    "requests>=2.32,<3",
    "gunicorn>=23; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.26",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leyline = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["leyline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["leyline"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["authlib.*", "fakeredis.*"]
ignore_missing_imports = true
