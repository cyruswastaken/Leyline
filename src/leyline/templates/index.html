<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Secure Enterprise Helpdesk</title>

    <style nonce="{{ csp_nonce }}">
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            padding: 20px;
            background: #1f2937;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .user-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            white-space: nowrap;
        }

        .nav-link { color: white; opacity: 0.85; text-decoration: none; }
        .nav-link:hover { opacity: 1; text-decoration: underline; }

        #signout-button {
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            background: transparent;
            color: white;
            cursor: pointer;
        }

        #signout-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .chat-header h1 {
            margin: 0;
            font-size: 20px;
        }

        .chat-header p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.7;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 75%;
        }

        .user-message {
            background: #2563eb;
            color: white;
            margin-left: auto;
        }

        .bot-message {
            background: #e5e7eb;
            color: #111827;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        #message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        #send-button {
            margin-left: 10px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        #send-button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <div>
                <h1>Secure Enterprise Helpdesk</h1>
                <p>AI-powered internal support assistant</p>
            </div>
            <div class="user-bar">
                {% if "kb_admin" in user.roles %}<a class="nav-link" href="/admin/documents">Documents</a>{% endif %}
                {% if "security_auditor" in user.roles %}<a class="nav-link" href="/monitoring">Monitoring</a>{% endif %}
                <span id="user-name">{{ user.name or user.email or "Signed in" }}</span>
                <button id="signout-button" type="button">Sign out</button>
            </div>
        </div>

        <div class="messages" id="messages">

            <div class="message bot-message">
                Hello! How can I help you today?
            </div>

        </div>

        <div class="chat-input">

            <input
                type="text"
                id="message-input"
                placeholder="Ask a question..."
            >

            <button id="send-button">
                Send
            </button>

        </div>

    </div>
    <script nonce="{{ csp_nonce }}">
    const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
    const messagesContainer = document.getElementById("messages");
    const messageInput = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");


    function addMessage(content, type) {
        const messageElement = document.createElement("div");

        messageElement.classList.add("message");

        if (type === "user") {
            messageElement.classList.add("user-message");
        } else {
            messageElement.classList.add("bot-message");
        }

        messageElement.textContent = content;

        messagesContainer.appendChild(messageElement);

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }


    async function sendMessage() {
        const message = messageInput.value.trim();

        if (!message) {
            return;
        }

        addMessage(message, "user");

        messageInput.value = "";

        sendButton.disabled = true;

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-Token": csrfToken
                },
                body: JSON.stringify({
                    message: message
                })
            });

            if (response.status === 401) {
                // Session expired: sign in again.
                window.location.assign("/login?next=/");
                return;
            }

            const data = await response.json();

            if (!response.ok) {
                addMessage(
                    data.error || "Something went wrong.",
                    "bot"
                );
                return;
            }

            addMessage(data.response, "bot");

        } catch (error) {
            console.error("Chat request failed:", error);

            addMessage(
                "Unable to connect to the server.",
                "bot"
            );

        } finally {
            sendButton.disabled = false;
            messageInput.focus();
        }
    }


    sendButton.addEventListener("click", sendMessage);


    document.getElementById("signout-button").addEventListener(
        "click",
        async function () {
            try {
                const response = await fetch("/logout", {
                    method: "POST",
                    headers: { "X-CSRF-Token": csrfToken }
                });
                const data = await response.json();
                window.location.assign(data.redirect || "/");
            } catch (error) {
                window.location.assign("/");
            }
        }
    );


    messageInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>
</body>
</html>
