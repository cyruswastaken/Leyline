name: Security

# Dependency, secret, image and code scanning. Make these jobs required status
# checks in the repository's branch protection to have them block merges.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: new advisories appear without code changes

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit pinned runtime and dev dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --no-deps --disable-pip
          pip-audit -r requirements-dev.txt --no-deps --disable-pip

  frontend-dependencies:
    name: Frontend dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install without running package scripts
        run: npm ci --ignore-scripts
      - name: Anything shipped to browsers must be clean
        run: npm audit --omit=dev
      - name: Build tooling must have nothing high or critical
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - name: Scan
        # The CLI image avoids the action's licence requirement for organisations.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --verbose

  image:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t leyline-app:scan .
      - name: Scan for HIGH and CRITICAL vulnerabilities with a fix available
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: leyline-app:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - name: Scan the repository for misconfiguration (Dockerfile, compose)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  zap:
    name: Web scan (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Passive baseline scan of the unauthenticated surface
        # Fails on FAIL-level alerts only. The signed-in surface is covered by
        # the access-matrix and red-team tests, not by this scan.
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 -I -r report.html
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/report.html
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
