name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

  docker:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Start app, Redis and Keycloak
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke test
        run: |
          base=http://127.0.0.1:8000
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          test "$(code $base/healthz)" = "200"
          # readiness is 503 here: no model credentials are configured
          test "$(code $base/readyz)" = "503"
          curl -s $base/readyz | grep -q '"redis_reachable":true'
          curl -s $base/readyz | grep -q '"oidc_configured":true'

          # anonymous callers are turned away
          test "$(code -H 'Accept: application/json' $base/me)" = "401"
          test "$(code -H 'Accept: application/json' $base/monitoring/events)" = "401"
          test "$(code -X POST $base/chat)" = "401"
          test "$(code $base/documents)" = "404"

          # browsers are sent to the identity provider with PKCE
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept: text/html' $base/)
          test "$loc" = "$base/login?next=/"
          idp=$(curl -s -o /dev/null -w '%{redirect_url}' $base/login)
          echo "$idp" | grep -q 'code_challenge_method=S256'
          echo "$idp" | grep -q 'state='
          echo "$idp" | grep -q 'nonce='

          # the container does not run as root
          test "$(docker compose exec -T app id -u)" != "0"

      - name: Full login against Keycloak, per persona
        run: |
          pip install requests
          python scripts/e2e_login.py

      - name: Production mode refuses to start unconfigured
        run: |
          if docker run --rm leyline-app:latest; then
            echo "expected startup failure without model/identity configuration"
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
