name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: leyline
          POSTGRES_PASSWORD: leyline-dev-only
          POSTGRES_DB: leyline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leyline -d leyline"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # GitHub sets CI=true; with it, tests that need Postgres or Azurite
      # fail loudly instead of being skipped.
      TEST_DATABASE_URL: postgresql+pg8000://leyline:leyline-dev-only@localhost:5432/leyline_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Start Azurite (blob storage emulator)
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.33.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

  docker:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack
        # migrate runs once and exits; --wait fails if the app, worker,
        # Keycloak or any dependency never becomes healthy.
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Load the sample corpus
        run: docker compose run --rm app python -m leyline.seed

      - name: Smoke test
        run: |
          base=http://127.0.0.1:8000
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          test "$(code $base/healthz)" = "200"
          # readiness is 503 here: no model credentials are configured
          test "$(code $base/readyz)" = "503"
          for check in redis_reachable database_reachable schema_current \
                       blob_storage_reachable oidc_configured; do
            curl -s $base/readyz | grep -q "\"$check\":true"
          done

          # anonymous callers are turned away
          test "$(code -H 'Accept: application/json' $base/me)" = "401"
          test "$(code -H 'Accept: application/json' $base/monitoring/events)" = "401"
          test "$(code -X POST $base/chat)" = "401"
          test "$(code $base/documents)" = "404"

          # browsers are sent to the identity provider with PKCE
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept: text/html' $base/)
          test "$loc" = "$base/login?next=/"
          idp=$(curl -s -o /dev/null -w '%{redirect_url}' $base/login)
          echo "$idp" | grep -q 'code_challenge_method=S256'
          echo "$idp" | grep -q 'state='
          echo "$idp" | grep -q 'nonce='

          # the container does not run as root
          test "$(docker compose exec -T app id -u)" != "0"

      - name: End to end - login, upload, index, ACLs, delete
        run: |
          pip install requests
          python scripts/e2e_login.py

      - name: Production mode refuses to start unconfigured
        run: |
          if docker run --rm leyline-app:latest; then
            echo "expected startup failure without model/identity configuration"
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
